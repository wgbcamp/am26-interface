<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>AM26 Interface</title>
    <style>
      @font-face {
        src: url("fonts/Avenir\ Next.ttc") format("ttc");
        font-family: "Avenir Next", sans-serif;
        font-weight: normal;
        font-style: normal;
      }
      @keyframes bounce {
        0% {
          transform: translateY(0%);
        }
        
        50% {
          transform: translateY(4%);
        }

        100% {
          transform: translateY(0%);
        }
      }
      @keyframes rotate {
        0% {
          rotate: 0deg;
        }
        100% {
          rotate: 360deg;
        }
      }
      .loadingAnimation {
        animation: rotate 2.5s forwards ease-in-out infinite;
        border-style: dotted;
        border-color: black;
        border-width: 15px;
        border-radius: 100%;
        width: 60px;
        height: 60px;
        position: absolute;
        opacity: 0%;
      }
        html {
          background-color: rgb(255, 255, 255);
          font-family: "Avenir Next", sans-serif;
          width: 100vw;
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
        }
        body {
          position: relative;
          width: min(100vw, calc(100vh * 16 / 9));
          height: min(100vh, calc(100vw * 9 / 16));
          margin: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
        }
        a {
          text-decoration: none;
          color: white;
        }
        .navigation {
          height: 100%;
          width: 100%;
          background-color: white;
          display: flex;
          align-items: center;
          justify-content: end;
          position: absolute;
          z-index: -1;
        }
        .navProjectContainer {
          display: flex;
          flex-direction: column;
          height: 90%;
          width: 20%;
          padding-right: 80px;
          padding-left: 30px;
        }
        .navReturn {
          padding-bottom: 35%;
          font-weight: bold;
          color: rgba(0, 76, 151, 1);
          cursor: pointer;
          display: flex;
          gap: 20px;
        }
        .navProjectTitle {
          font-size: calc(12px + 1vw);
          font-weight: bold;
          padding-bottom: 24px;
        }
        .navProjectDescription {
          font-size: calc(2.8 * 0.2vw);
          height: 100%;
          line-height: 30px;
        }
        .navProjectQRCode {
          width: 150px;
          padding-bottom: 32px;
        }
        .navNext {
          font-weight: bold;
          display: flex;
          align-items: end;
          color: rgba(0, 76, 151, 1);
          cursor: pointer;
          gap: 20px;
        }
        .background {
          height: 100%;
          width: 100%;
          background-image: linear-gradient(rgba(33, 74, 149, 0.6), rgba(33, 74, 149, 0.6)), url("misc-assets/backgroundImage.png");
          background-size: contain;
          background-color: rgb(33, 74, 149);
          position: absolute;
          transition: opacity 0.5s ease-in-out;
        }
        .category {
          position: absolute;
          height: 25%;
          width: 14%;
          animation: bounce 7s ease-in-out 0s infinite normal forwards;
          cursor: pointer;
        }
        .imageContainer {
          position: relative;
          height: 100%;
          width: 100%;
          border-radius: 50%;
          border: calc(3 * 0.15vw) solid rgb(23, 27, 96);
          box-shadow: 3px 4px 10px 5px rgba(0,0,0, 0.3);
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
        }
        .linkContainer {
          position: relative;
          height: calc(45 * 0.15vw);
          width: calc(45 * 0.15vw);
          border-radius: 50%;
          border: calc(3 * 0.15vw) solid;
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
          background-color: white;
          text-align: center;
        }
        .linkWidthContainer {
          width: 90%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        .title {
          font-weight: bold;
          font-size: calc(5 * 0.15vw);
          width: 80%;
        }
        .description {
          font-size: calc(3.2 * 0.15vw);
          text-align: center;
          padding-top: 5px;
          padding-bottom: 5px;
        }
        .rotate180 {
          transform: rotate(180deg);
          width: calc(3px + 1vw);
          height: calc(3px + 1vw);
        }
        .dot {
          border-radius: 100%;
          height: 18px;
          width: 18px;
        }
        .button {
          color: white;
          font-weight: 600;
          font-size: 18px;
          padding: 40px;
          padding-top: 12px;
          padding-bottom: 12px;
          border-radius: 25px;
          cursor: pointer;
        }
        .instructions {
          color: white;
          position: absolute;
          display: flex;
          align-items: center;
          justify-content: center;
          height: 30%;
          width: 100%;
        } 
        .instructionsChild {
          display: flex;
          gap: 13px;
          flex-direction: column;
          text-align: center;
        }
        .instructionsTitle {
          font-weight: bold;
          font-size: calc(9 * 0.2vw);
          line-height: calc(5 * 0.2vw);
        }
        .instructionsSeparator {
          background-color: white;
          height: calc(1 * 0.075vw);
          margin-top: 10px;
          margin-bottom: 10px;
          width: 100%;
        }
        .instructionsSubtitle {
          font-weight: 500;
          font-size: calc(2.8 * 0.2vw);
        }
        .iframe {
          height: 100%;
          width: 100%;
          position: relative;
          z-index: -2;
          opacity: 0%;
          transition: opacity 0.5s ease-in-out;
        }
        .iframeContainer {
          height: 95%;
          width: 100%;
          position: relative;
          z-index: -1;
          margin-right: 3%;
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
        }
    </style>
</head>
  <body>
    <div class="background" id="background">
      <div class="instructions">
        <div class="instructionsChild">
          <span class="instructionsTitle">IMF DATA PRODUCTS</span>
          <div class="instructionsSeparator"></div>
          <span class="instructionsSubtitle">TAP A GLOBE TO EXPLORE</span>
        </div>
      </div>
    </div>
    <div class="navigation" id="navigation">
      <div class="navProjectContainer" id="navProjectContainer">
        <div class="navReturn" onclick="returnHome()">
          <svg width="25" height="25" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14.2188 22.4219L13.0156 23.625C12.4688 24.1172 11.6484 24.1172 11.1562 23.625L0.546875 12.9609C0 12.4688 0 11.6484 0.546875 11.1562L11.1562 0.492188C11.6484 0 12.5234 0 13.0156 0.492188L14.2188 1.69531C14.7656 2.24219 14.7109 3.0625 14.2188 3.60938L7.60156 9.84375H23.3516C24.0625 9.84375 24.6641 10.4453 24.6641 11.1562V12.9062C24.6641 13.6719 24.0625 14.2188 23.3516 14.2188H7.60156L14.2188 20.5078C14.7109 21.0547 14.7656 21.875 14.2188 22.4219Z" fill="#004C97"/>
          </svg>
          <span style="display: flex; align-items: center;">RETURN TO MAIN MENU</span></div>
        <div class="navProjectTitle" id="navProjectTitle">PORTWATCH</div>
        <div class="navProjectDescription" id="navProjectDescription"></div>
        <img class="navProjectQRCode" id="navProjectQRCode">
        <div class="navNext" onclick="nextProject()">
          <span>NEXT PROJECT</span>
          <svg width="25" height="25" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10.4453 1.69531L11.6484 0.492186C12.1953 -1.07571e-06 13.0156 -1.004e-06 13.5078 0.492187L24.1172 11.1562C24.6641 11.6484 24.6641 12.4688 24.1172 12.9609L13.5078 23.625C13.0156 24.1172 12.1406 24.1172 11.6484 23.625L10.4453 22.4219C9.89844 21.875 9.95313 21.0547 10.4453 20.5078L17.0625 14.2734L1.3125 14.2734C0.601564 14.2734 1.39125e-06 13.6719 1.4534e-06 12.9609L1.60639e-06 11.2109C1.67333e-06 10.4453 0.601564 9.89844 1.3125 9.89844L17.0625 9.89844L10.4453 3.60937C9.95313 3.0625 9.89844 2.24219 10.4453 1.69531Z" fill="#004C97"/>
          </svg>
        </div>
      </div>
      <div class="iframeContainer" id="iframeContainer">
        <div class="loadingAnimation" id="loadingAnimation"></div>
        <iframe
          id="iframe"
          class="iframe"
          width="100%"
          height="100%"
          style="border-right: 2px solid rgba(0, 0, 0, 0.2); border-left: 0px"
          src="">
        </iframe>
      </div>
    </div>
    <script>
      
      var projectIndex = null;

      var x = document.getElementById("navigation");
      var y = document.getElementById("background");
      var z = document.getElementById("navProjectContainer");
      var zTitle = document.getElementById("navProjectTitle");
      var zDesc = document.getElementById("navProjectDescription");
      var zQR = document.getElementById("navProjectQRCode");
      var a = document.getElementById("iframe");
      var b = document.getElementById("iframeContainer");
      var c = document.getElementById("loadingAnimation");

      a.addEventListener('load', (event) => {
        c.style.display = "none";
        setTimeout(() => {
          c.style.opacity = "100%";
          a.style.opacity = "100%";
        }, 250);
      })

      function enterNavigation(title, description, path, index, qrCode) {
        
        y.style.opacity = "0%";

        zTitle.innerHTML = title;
        zDesc.innerHTML = description;
        zQR.src = qrCode;
        setTimeout(() => {
          

          y.style.zIndex = -1;
        
          x.style.zIndex = 0;

          a.src = path;
          a.style.opacity = "65%";
          c.style.opacity = "100%";

          b.style.height = "95%";
          b.style.width = "100%";
          b.style.zIndex = 1;
          b.style.marginRight = "3%";

          c.style.display = "unset";

          projectIndex = index;
          console.log(projectIndex);
        }, 500);
      }

      function returnHome() {

        y.style.zIndex = 1;
        y.style.opacity = "100%";
        
        x.style.zIndex = 0;

        b.style.zIndex = 0;

        projectIndex = null;

        a.src = "";
      }

      function nextProject() {
        c.style.display = "unset";
        a.style.opacity = "65%";
        c.style.opacity = "100%";

        if (projectIndex < categorySpecs.length - 1) {
          projectIndex++;
        } else {
          projectIndex = 0;
        }

        console.log(projectIndex);
        zTitle.innerHTML = categorySpecs[projectIndex].title;
        zDesc.innerHTML = categorySpecs[projectIndex].htmlDescription;
        zQR.src = categorySpecs[projectIndex].qrCode;
        a.src = categorySpecs[projectIndex].link;
      }

      const categorySpecs = [
        {
          categoryStyle: "position: absolute; left: 15%; top: 5%;",
          imageContainerStyle: "",
          imageSource: "project-images/portwatch.png",
          imageWidth: "150%",
          linkContainerStyle: "left: -30%; bottom: 100%; border-color: rgb(48, 174, 184);",
          title: "PortWatch",
          description: "Monitoring Trade Disruptions from Space",
          fill: "rgb(48, 174, 184)",
          htmlDescription: "<span>Using satellite-based vessel data and big data analytics, the PortWatch platform helps policymakers, analysts, and other public stakeholders assess the impact of disruptions to maritime trade. Users can simulate the potential indirect spillover effects of port disruptions to other countries in the maritime network and global supply chains.</span>",
          link: "https://portwatch.imf.org/",
          qrCode: "qr-codes/portWatch-QR.png",
          index: 0
        },
        {
          categoryStyle: "position: absolute; right: 15%; top: 5%;",
          imageContainerStyle: "",
          imageSource: "project-images/mario.png",
          imageWidth: "100%",
          linkContainerStyle: "left: 65%; bottom: 110%; border-color: rgb(212, 58, 41);",
          title: "MARIO",
          description: "The World’s Largest Statistical Sudoku",
          fill: "rgb(212, 58, 41)",
          htmlDescription: "<span>The MARIO project (Multi Analytical Regional Input Output model) is a large scale IMF initiative that provides a detailed, global view of how economies are interconnected. It covers 200+ economies and hundreds of industries and products, spans multiple decades, and maps global value chains—showing who produces what, where, and for whom. It also quantifies cross border economic spillovers and links economic activity to environmental and social impacts, enabling deeper analysis of global economic dynamics.</span>",
          link: "misc-assets/global_trade_dashboard_v3.html",
          qrCode: "",
          index: 1
        },
        {
          categoryStyle: "position: absolute; left: 5%; bottom: 35%;",
          imageContainerStyle: "",
          imageSource: "project-images/FDI Mapper.jpeg",
          imageWidth: "150%",
          linkContainerStyle: "left: -20%; bottom: 50%; border-color: rgb(248, 200, 51);",
          title: "FDI Mapper",
          description: "Investment Across Borders",
          fill: "rgb(248, 200, 51)",
          htmlDescription: "<p>Over the past three decades, global foreign direct investment (FDI) has expanded substantially. In recent years. The growth has been particularly rapid in emerging markets and developing economies. Beyond cross-border trade in goods and services, economies have become connected through direct investment, creating complex production networks that knit together supply chains across continents.  Use the FDI Mapper to explore these investment linkages and see how economies are connected around the world.</p><p>Data source: Direct Investment Positions by Counterpart Economy (formerly CDIS), available on data.imf.org.</p>",
          link: "https://datacommons.shinyapps.io/fdi-explorer/",
          qrCode: "qr-codes/fdiMapper-QR.png",
          index: 2
        },
        {
          categoryStyle: "position: absolute; left: 43.3%; top: 30%;",
          imageContainerStyle: "",
          imageSource: "project-images/Trade Mapper.png",
          imageWidth: "180%",
          linkContainerStyle: "left: 25%; bottom: 35%; border-color: rgb(120, 189, 46);",
          title: "Trade Mapper",
          description: "Tracking Global Trade Growth",
          fill: "rgb(120, 189, 46)",
          htmlDescription: "<p>Global trade is constantly evolving. Explore how merchandise exports are growing across regions and over time, and discover which economies are driving global trade growth. The Trade Mapper provides an interactive view of the trends and dynamics shaping international trade in goods. It also shows how trading partnerships evolve and the shares of imports and exports across countries.</p><p>Data source: International Trade in Goods by Partner Country (IMTS, formerly DOTS), available on data.imf.org.</p>",
          link: "https://datacommons.shinyapps.io/world-trade-mapper/",
          qrCode: "qr-codes/tradeMapper-QR.png",
          index: 3
        },
        {
          categoryStyle: "position: absolute; right: 6%; bottom: 35%;",
          imageContainerStyle: "overflow: visible; padding-left: 18px; padding-top: 3px",
          imageSource: "project-images/geopulse.png",
          imageWidth: "168%",
          linkContainerStyle: "left: 60%; bottom: 50%; border-color: rgb(55, 154, 220);",
          title: "GeoPulse",
          description: "Track, Analyze, and Respond to Economic Risk",
          fill: "rgb(55, 154, 220)",
          htmlDescription: "<div><p>IMF GeoPulse is a geospatial platform that monitors physical risks to the economy, people, and our environment. The frequency and severity of damages from natural disasters such as floods, hurricanes, and wildfires have been increasing over time resulting in billions of dollars damage to economies and loss of human lives. As impacts often ripple through economies, including the financial systems, public finances, and trade, the first-order effects of most of these risks are highly localized.</p><br /><span>GeoPulse provides high-resolution geospatial data on hazards, exposures, and risks to help economies prepare for, respond to, and recover from natural disasters. It is state-of-the-art platform translating complex and big geospatial data into actionable insights for policy analysis, financing, and resilience planning now and for the future.</span></div>",
          link: "https://wgbcamp.github.io/geopulse-dev/",
          qrCode: "qr-codes/geoPulse-QR.png",
          index: 4
        },

        {
          categoryStyle: "position: absolute; left: 25%; bottom: 10%;",
          imageContainerStyle: "",
          imageSource: "project-images/compilershub.png",
          imageWidth: "100%",
          linkContainerStyle: "right: 25%; bottom: 60%; border-color: rgb(221, 91, 32);",
          title: "Compilers Hubs",
          description: "Connect with the International Community of Macroeconomic Statisticians",
          fill: "rgb(221, 91, 32)",
          htmlDescription: "<span>The International Community of Macroeconomic Statisticians (ICMStat) is dedicated to advancing statistical standards and championing the value of high quality statistics. Leverage the Hub—an interactive digital platform where members access international statistical manuals, training materials, and tools, and engage with peers for collaboration and advice.</span>",
          link: "https://compilershub.imf.org/home",
          qrCode: "qr-codes/compilersHub-QR.png",
          index: 5
        },
        {
          categoryStyle: "position: absolute; right: 25%; bottom: 10%;",
          imageContainerStyle: "",
          imageSource: "project-images/Portfolio Investment Mapper.png",
          imageWidth: "180%",
          linkContainerStyle: "left: 65%; bottom: 60%; border-color: rgb(31, 26, 95);",
          title: "Portfolio Investment Mapper",
          description: "Following Capital Around the Globe  ",
          fill: "rgb(31, 26, 95)",
          htmlDescription: "<p>Portfolio investments connect financial markets across borders. From pension funds and insurance companies to investment funds, investors hold securities around the world to diversify risk and seek opportunities. Explore the CPIS to see how countries are linked through cross-border portfolio investment and how global investment holdings are distributed across economies.</p><p>Data source: Coordinated Portfolio Investment Survey (CPIS), covering more than 80 economies and available on data.imf.org.</p>",
          link: "https://datacommons.shinyapps.io/cpis-explorer/",
          qrCode: "qr-codes/portfolioInvestmentMapper-QR.png",
          index: 6
        }
      ];

      function spawnCategories() {
        categorySpecs.forEach((e) => {
          const node = document.createElement("div");
          node.innerHTML =
          `<div class="category" style="${e.categoryStyle}" onclick='enterNavigation("${e.title}", "${e.htmlDescription}", "${e.link}", ${e.index}, "${e.qrCode}")'>
            <div class="imageContainer" style="${e.imageContainerStyle}">
              <img src="${e.imageSource}" width="${e.imageWidth}">
            </div>
            <div class="linkContainer" style="${e.linkContainerStyle}">
              <div class="linkWidthContainer">
                <span class="title">${e.title}</span>
                <span class="description" style="padding-bottom: 5%;">${e.description}</span>
                <svg class="rotate180" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M10 18.75C14.8438 18.75 18.75 14.8438 18.75 10C18.75 5.15625 14.8438 1.25 10 1.25C5.15625 1.25 1.25 5.15625 1.25 10C1.25 14.8438 5.15625 18.75 10 18.75ZM10 0C15.5078 0 20 4.49219 20 10C20 15.5078 15.5078 20 10 20C4.49219 20 0 15.5078 0 10C0 4.49219 4.49219 0 10 0ZM5.19531 9.17969C4.96094 8.94531 4.96094 8.55469 5.19531 8.32031C5.42969 8.08594 5.82031 8.08594 6.05469 8.32031L10 12.2266L13.9453 8.32031C14.1797 8.08594 14.5703 8.08594 14.8047 8.32031C15.0781 8.55469 15.0781 8.94531 14.8047 9.17969L10.4297 13.5547C10.1953 13.8281 9.80469 13.8281 9.57031 13.5547L5.19531 9.17969Z"
                    fill="${e.fill}" />
                </svg>
              </div>
            </div>
          </div>`;
          document.getElementById("background").appendChild(node);
        });
        document.querySelectorAll('.category').forEach((e) => {
          e.style.animationDelay = (Math.random() * 3) + 's';
        })
      }

      spawnCategories();
    </script>
  </body>
</html>
