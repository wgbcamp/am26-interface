<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>AM25 Interface</title>
    <style>
      @font-face {
        src: url("Avenir\ Next.ttc") format("ttc");
        font-family: "Avenir Next", sans-serif;
        font-weight: normal;
        font-style: normal;
      }
      @keyframes bounce {
        0% {
          transform: translateY(0%);
        }
        
        50% {
          transform: translateY(25%);
        }

        100% {
          transform: translateY(0%);
        }
      }
        html, body {
            background-color: rgb(30, 75, 146);
            height: 100%;
            width: 100%;
            font-family: "Avenir Next", sans-serif;
        }
        .background {
            height: 100%;
            width: 100%;
            background-image: url("backgroundImage.png");
            background-size: contain;
            position: relative;
        }
        .category {
          position: absolute;
          animation: bounce 1s ease-in-out 0s infinite normal forwards;
        }
        .imageContainer {
          position: relative;
          height: 200px;
          width: 200px;
          border-radius: 50%;
          border: 10px solid rgb(23, 27, 96);
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
        }
        .linkContainer {
          position: relative;
          height: 120px;
          width: 120px;
          border-radius: 50%;
          border: 8px solid;
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
          background-color: white;
        }
        .linkWidthContainer {
          width: 80%;
            display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        .title {
          font-weight: bold;
          text-transform: uppercase;
          font-size: 12px;
        }
        .description {
          font-size: 8px;
          text-align: center;
          padding-bottom: 5px;
        }
        .rotate180 {
          transform: rotate(180deg);
        }
    </style>
</head>
  <body>
    <div class="background">
      <div class="category">
        <div class="imageContainer" style="left: 40px; top: 20px">
          <img src="portwatch.png" width="255px">
        </div>
        <div class="linkContainer" style="left: 180px; bottom: 190px; border-color: rgb(150, 27, 96);">
          <div class="linkWidthContainer">
            <span class="title">PORTWATCH</span>
            <span class="description">Real-time port monitoring and shipping traffic analytics powered by IMF data infrastructure.</span>
            <svg class="rotate180" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M10 18.75C14.8438 18.75 18.75 14.8438 18.75 10C18.75 5.15625 14.8438 1.25 10 1.25C5.15625 1.25 1.25 5.15625 1.25 10C1.25 14.8438 5.15625 18.75 10 18.75ZM10 0C15.5078 0 20 4.49219 20 10C20 15.5078 15.5078 20 10 20C4.49219 20 0 15.5078 0 10C0 4.49219 4.49219 0 10 0ZM5.19531 9.17969C4.96094 8.94531 4.96094 8.55469 5.19531 8.32031C5.42969 8.08594 5.82031 8.08594 6.05469 8.32031L10 12.2266L13.9453 8.32031C14.1797 8.08594 14.5703 8.08594 14.8047 8.32031C15.0781 8.55469 15.0781 8.94531 14.8047 9.17969L10.4297 13.5547C10.1953 13.8281 9.80469 13.8281 9.57031 13.5547L5.19531 9.17969Z"
                fill="black" />
            </svg>
          </div>
        </div>
      </div>
    </div>
    <script></script>
  </body>
</html>
